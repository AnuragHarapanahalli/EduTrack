spring:
  profiles:
    active: dev
  application:
    name: edutrack-backend
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 30MB

app:
  upload-dir: ${user.dir}/../uploads
  jwt:
    secret: EduTrackSuperSecretSigningKeyForJwtTokens2026PBLSemesterVProjectKey
    expiration-ms: 86400000 # 24 hours

---
spring:
  config:
    activate:
      on-profile: dev
  datasource:
    url: jdbc:h2:mem:edutrackdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: true

---
spring:
  config:
    activate:
      on-profile: postgres
  datasource:
    url: jdbc:postgresql://localhost:5432/edutrackdb
    username: postgres
    password: postgrespassword
    driver-class-name: org.postgresql.Driver
  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: false
