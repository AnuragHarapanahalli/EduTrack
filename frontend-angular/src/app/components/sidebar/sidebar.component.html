<div
  class="gc-sidebar-backdrop"
  *ngIf="sidebarOpen"
  (click)="toggleSidebar()">
</div>

<aside
  class="gc-sidebar"
  [class.open]="sidebarOpen">

  <div class="gc-sidebar-inner">

    <!-- ================= MENU ================= -->

    <div class="gc-sidebar-menu">

      <a
        class="gc-sidebar-item"
        [class.active]="!selectedSubject"
        (click)="goDashboard()">

        <i class="fa-solid fa-house gc-sidebar-icon"></i>
        <span>Dashboard</span>

      </a>

    </div>

    <div class="gc-sidebar-divider"></div>

    <!-- ================= TEACHER ACTIONS ================= -->

    <div
  class="gc-sidebar-section"
  *ngIf="user?.role === 'INSTRUCTOR'">

  <button
        class="gc-sidebar-action-btn"
        (click)="createClass()">

        <i class="fa-solid fa-plus"></i>
        <span>Create Class</span>

      </button>

      <button
        class="gc-sidebar-action-btn"
        *ngIf="selectedSubject"
        (click)="inviteStudents()">

        <i class="fa-solid fa-user-plus"></i>
        <span>Add Students</span>

      </button>

      <div class="gc-sidebar-divider"></div>

      <span class="gc-sidebar-label">
        Your Classes
      </span>

      <ng-container *ngIf="subjects.length > 0; else noClasses">

        <a
          *ngFor="let subject of subjects"
          class="gc-sidebar-item"
          [class.active]="selectedSubject?.id === subject.id"
          (click)="selectSubject(subject)">

          <div class="gc-class-badge-icon">
            {{ getInitials(subject.name) }}
          </div>

          <div class="gc-class-item-text">

            <strong>{{ subject.name }}</strong>

            <small>{{ subject.code }}</small>

          </div>

        </a>

      </ng-container>

    </div>

    <!-- ================= STUDENT VIEW ================= -->

    <div
      class="gc-sidebar-section"
      *ngIf="user?.role === 'STUDENT'">

      <span class="gc-sidebar-label">

        Enrolled Classes

      </span>

      <ng-container *ngIf="subjects.length > 0; else noClasses">

        <a
          *ngFor="let subject of subjects"
          class="gc-sidebar-item"
          [class.active]="selectedSubject?.id === subject.id"
          (click)="selectSubject(subject)">

          <div class="gc-class-badge-icon">
            {{ getInitials(subject.name) }}
          </div>

          <div class="gc-class-item-text">

            <strong>{{ subject.name }}</strong>

            <small>{{ subject.code }}</small>

          </div>

        </a>

      </ng-container>

    </div>

    <!-- ================= EMPTY ================= -->

    <ng-template #noClasses>

      <div class="gc-empty-sidebar-msg">

        No classes available.

      </div>

    </ng-template>

    <!-- ================= FOOTER ================= -->

    <div class="gc-sidebar-footer">

      <div class="gc-footer-user">

        <div class="gc-user-info">

          <strong>{{ user?.fullName }}</strong>

          <small>{{ user?.email }}</small>

        </div>

        <button
          class="gc-logout-btn"
          title="Logout"
          (click)="logout()">

          <i class="fa-solid fa-right-from-bracket"></i>

        </button>

      </div>

    </div>

  </div>

</aside>
