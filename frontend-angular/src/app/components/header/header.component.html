<header class="gc-header">

  <!-- ================= LEFT ================= -->

  <div class="gc-header-left">

    <div class="gc-brand" (click)="goToDashboard()">

      <div class="gc-logo-pod">

        <i class="fa-solid fa-graduation-cap"></i>

      </div>


      <div>

        <div class="gc-brand-title">
          EduTrack
        </div>


        <div class="gc-brand-sub">
          Learning Management System
        </div>

      </div>


    </div>

  </div>



  <!-- ================= CENTER EMPTY ================= -->

  <div class="gc-header-center">

  </div>



  <!-- ================= RIGHT ================= -->

  <div class="gc-header-right">


    <!-- Notifications -->

    <button
      class="gc-header-action"
      title="Notifications">

      <i class="fa-regular fa-bell"></i>

    </button>



    <!-- Settings -->

    <button
      class="gc-header-action"
      title="Settings">

      <i class="fa-solid fa-gear"></i>

    </button>



    <!-- User -->

    <div class="gc-user-pod">


      <div class="gc-avatar-circle">

        {{ initials }}

      </div>


      <div class="gc-user-info">


        <span class="gc-user-name">

          {{ user?.fullName }}

        </span>


        <span class="gc-user-role">

          {{ user?.role }}

        </span>


      </div>


    </div>



    <!-- Logout -->

    <button
      class="gc-header-action"
      title="Logout"
      (click)="logout()">


      <i class="fa-solid fa-right-from-bracket"></i>


    </button>



  </div>


</header>
