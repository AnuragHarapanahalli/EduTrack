name: EduTrack Mobile CI

on:
  push:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/mobile-ci.yml'

jobs:
  test-shared-and-build-android:
    name: Shared Tests & Android Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run Shared Multiplatform Tests
        working-directory: mobile
        run: ./gradlew :shared:allTests

      - name: Build Android Debug APK
        working-directory: mobile
        run: ./gradlew :androidApp:assembleDebug

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: edutrack-android-debug
          path: mobile/androidApp/build/outputs/apk/debug/*.apk

  build-ios-framework:
    name: iOS Framework Build
    runs-on: macos-14
    needs: test-shared-and-build-android

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build iOS XCFramework
        working-directory: mobile
        run: ./gradlew :shared:assembleXCFramework
